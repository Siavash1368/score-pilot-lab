[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "score-pilot-lab"
version = "0.1.0"
description = "Bureau-attribute PD scorecard on Lending Club 2007-2018, piloted the way a score vendor would."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Core
    "duckdb",
    "pandas",
    "numpy",
    "scipy",
    "scikit-learn",
    "statsmodels",
    "optbinning",
    "xgboost",
    "lightgbm",
    "shap",
    "matplotlib",
    # Engineering
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mlflow", "streamlit", "kaggle"]
extended = ["optuna", "interpret-core"]   # NB07b: hyper-parameter search, EBM

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
